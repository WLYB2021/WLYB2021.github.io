name: Deploy Blog to GitHub Pages

on:
  push:
    branches: [ "main" ]   # 内容推main 时发布
  workflow_dispatch:              # 允许手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.167.0
  THEME_REPO: https://github.com/adityatelange/hugo-PaperMod.git
  THEME_VERSION: v8.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 主题被 .gitignore 排除（不占用仓库体积），需在 CI 单独拉取
      - name: Checkout theme
        run: |
          git clone --depth 1 --branch "${THEME_VERSION}" "${THEME_REPO}" themes/PaperMod
          chmod +x scripts/patch-theme.sh
          ./scripts/patch-theme.sh themes/PaperMod

      - name: Install Hugo
        run: |
          curl -sSL -o /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        id: build
        run: |
          # baseURL 优先用 Pages 注入的真实地址，未注入时回退到 hugo.toml
          BASE="${{ steps.pages.outputs.base_url }}/"
          hugo --minify --gc --baseURL "$BASE"
        env:
          HUGO_ENV: production
          TZ: Asia/Shanghai

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4