# 用户站点仓库：WLYB2021.github.io → https://wlyb2021.github.io
baseURL = "https://wlyb2021.github.io/"
defaultContentLanguage = "zh"
title = "Xi 的博客"
theme = "PaperMod"
enableRobotsTXT = true
enableGitInfo = false
summaryLength = 30
hasCJKLanguage = true
# 忽略主题在更高版本 Hugo 下的历史告警
ignoreLogs = ["warning-partial-superfluous-prefix"]

# ---------- 顶层导航 ----------
# 改 url 即可增删菜单项；weight 控制顺序（小的靠左）
[[menu.main]]
name = "主页"
url = "/"
weight = 5

[[menu.main]]
name = "文章"
url = "/posts/"
weight = 10

[[menu.main]]
name = "归档"
url = "/archives/"
weight = 20

[[menu.main]]
name = "关于"
url = "/about/"
weight = 30

[[menu.main]]
name = "搜索"
url = "/search/"
weight = 40

[pagination]
pagerSize = 10

[taxonomies]
tag = "tags"
category = "categories"

[markup]
[markup.highlight]
style = "github"
noClasses = false
lineNos = false
[markup.goldmark.renderer]
unsafe = true
[markup.goldmark.parser]
autoHeadingID = true
autoHeadingIDType = "github"

[outputs]
home = ["HTML", "RSS", "JSON"]
section = ["HTML", "RSS"]
taxonomy = ["HTML", "RSS"]
term = ["HTML", "RSS"]

[sitemap]
changefreq = "weekly"
filename = "sitemap.xml"
priority = 0.5

# 主题放在 themes/PaperMod（由 GitHub Actions 克隆，无需 Go 环境）
# ---------- 站点参数 ----------
[params]
author = "Xi"
description = "Writing what's worth keeping."
defaultTheme = "auto"
ShowReadingTime = true
ShowWordCount = true
ShowToc = true
TocOpen = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowShareButtons = true
ShowRssButton = true
DisplayFullLangName = false
comments = true
mainSections = ["posts"]

# ---------- 站点图标 ----------
# 替换 static/favicon.svg 为自己的图标（建议 64×64，深底浅字）
[params.assets]
favicon = "favicon.svg"
favicon16x16 = "favicon.svg"
favicon32x32 = "favicon.svg"

# ---------- SEO / 分享卡片 ----------
# keywords 用英文逗号分隔；填 5~10 个你真正在写的主题词
keywords = ["技术笔记", "kotlin", "kmp", "跨平台", "思考", "折腾", "独立开发"]
# 站点默认分享图（放static/images/og-default.png，建议 1200×630）
images = ["images/og-default.png"]
# 主页与各页面是否输出 canonical / OG 元信息（PaperMod 默认开启）

# ---------- 首页模式 ----------
# mode = ["profile", "home"]：侧边栏显示个人名片，首页保留文章流
# 卡片渲染见 layouts/partials/profile_card.html（覆盖主题的失效实现）
[params.profile]
mode = ["profile", "home"]
title = "Xi"
subtitle = "Writing what's worth keeping."
desc = "No fixed theme, no persona. Just notes worth keeping — a detour, an idea, or the clarity that comes after a mistake."
# 头像：把图片放到 static/images/ 后填路径，如 "images/avatar.jpg"；留空不显示
imageUrl = ""
imageTitle = "Xi"
imageWidth = 150
imageHeight = 150

# 首页文章流
postsHeading = "最新文章"
homePostsLimit = 5
# true 时首页文章卡片不显示日期 / 阅读时长
hideMeta = false

# ---------- 联系方式 ----------
# 邮箱只填这一处，社交图标会自动引用，改地址不用改两遍
email = "yuxi279239@163.com"

# ---------- 社交图标（侧边栏） ----------
# 不需要的条目整段删除即可；完整图标名见：
# https://github.com/adityatelange/hugo-PaperMod/tree/master/assets/icons
[[params.social]]
name = "GitHub"
url = "https://github.com/WLYB2021"
icon = "github"
weight = 1

[[params.social]]
name = "Email"
url = "mailto:you@example.com"
icon = "email"
weight = 2

# ---------- 社交图标旧键名 ----------
# PaperMod v8.0 的 index_profile.html 读的是 socialIcons（复数）。
# 当前 profile 卡片已由 layouts/partials/profile_card.html 接管，
# 读的是上面的 params.social；此处仅为兼容主题旧实现保留。
[[params.socialIcons]]
name = "GitHub"
url = "https://github.com/WLYB2021"
icon = "github"
weight = 1

[[params.socialIcons]]
name = "Email"
url = "mailto:you@example.com"
icon = "email"
weight = 2

# ---------- Giscus 评论 ----------
# 已配置完成（https://giscus.app 生成）
# 前置条件：仓库 Settings → General → Features → 勾选 Discussions
# 隐藏单篇评论：在该页 front matter 加 disable_comments: true
[params.giscus]
repo = "WLYB2021/WLYB2021.github.io"
repoID = "R_kgDOVAsNXg"
category = "Announcements"
categoryID = "DIC_kwDOVAsNXs4DHUsi"
mapping = "pathname"
strict = "0"
reactionsEnabled = "1"
emitMetadata = "0"
inputPosition = "top"
theme = "preferred_color_scheme"
lang = "zh-CN"
loading = "lazy"

# ---------- 搜索 ----------
[params.search]
enable = true
fuzzy = true
heading = true
regex = false
tagnames = ["tag", "category"]

# ---------- 相关文章 ----------
[params.related]
threshold = 80
toLower = false
includeNewer = true
count = 8

# ---------- 底部版权 ----------
[params.footer]
showCopyright = true
showPoweredBy = true
copyright = "© 2026 Xi · Built with Hugo & PaperMod"