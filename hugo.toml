# 用户站点仓库：WLYB2021.github.io → https://wlyb2021.github.io
baseURL = "https://wlyb2021.github.io/"
defaultContentLanguage = "zh"
title = "Xi 的博客"
theme = "PaperMod"
enableRobotsTXT = true
# GitInfo：让每篇文章拿到真实的 lastmod（最后提交时间），meta 里可显示
# 「更新于」。CI 里 checkout 已带 fetch-depth: 0，本地预览也生效。
enableGitInfo = true
summaryLength = 30
hasCJKLanguage = true
# 忽略主题在更高版本 Hugo 下的历史告警
ignoreLogs = ["warning-partial-superfluous-prefix"]

# lastmod 取值顺序：显式 front matter > git 提交时间 > date
[frontmatter]
lastmod = [":git", "lastmod", "date"]

# ---------- 顶层导航 ----------
# 改 url 即可增删菜单项；weight 控制顺序（小的靠左）
[[menu.main]]
name = "主页"
url = "/"
weight = 5

[[menu.main]]
name = "文章"
url = "/posts/"
weight = 10

[[menu.main]]
name = "标签"
url = "/tags/"
weight = 15

[[menu.main]]
name = "归档"
url = "/archives/"
weight = 20

[[menu.main]]
name = "关于"
url = "/about/"
weight = 30

[[menu.main]]
name = "搜索"
url = "/search/"
weight = 40

[pagination]
pagerSize = 10

[taxonomies]
tag = "tags"

[markup]
[markup.highlight]
style = "github"
noClasses = false
lineNos = false
[markup.goldmark.renderer]
unsafe = true
[markup.goldmark.parser]
autoHeadingID = true
autoHeadingIDType = "github"

[outputs]
home = ["HTML", "RSS", "JSON"]
section = ["HTML", "RSS"]
taxonomy = ["HTML", "RSS"]
term = ["HTML", "RSS"]

[sitemap]
changefreq = "weekly"
filename = "sitemap.xml"
priority = 0.5

# 主题放在 themes/PaperMod（由 GitHub Actions 克隆，无需 Go 环境）
# ---------- 站点参数 ----------
[params]
author = "Xi"
description = "Writing what's worth keeping."
# 联系方式：邮箱只填这一处。报头社交图标（ed_masthead.html）与文章署名
# （post_meta.html）都读 params.email。必须在 [params] 直接层 ——
# 落到下面的 [params.xxx] 子表里就取不到（此前它被写进了 [params.profile]，
# 导致全站读到的 params.email 是空的）。
email = "yuxi279239@163.com"
# 日期显示格式：meta 的「创建于 / 更新于」都走它，保证两处一致。
# 必须在 [params] 直接层 —— 落到下面的 [params.xxx] 子表就取不到了。
DateFormat = "2006-01-02"
defaultTheme = "auto"
ShowReadingTime = true
ShowWordCount = true
ShowToc = true
TocOpen = false
ShowPostNavLinks = true
# 文章页不渲染面包屑：自建 post_header.html 已刻意移除它（全站都是文章，
# 顶部导航也已提供「主页」入口）。这里关掉，避免留下主题不消费的死开关。
ShowBreadCrumbs = false
ShowCodeCopyButtons = true
ShowShareButtons = true
ShowRssButton = true
DisplayFullLangName = false
comments = true
mainSections = ["posts"]
# 文章页 meta 显示「更新于 X」（lastmod 与 date 不同天时才出现）
showLastMod = true

# ---------- SEO / 分享卡片 ----------
# 必须写在 [params] 直接层，不能落进下面的 [params.assets]：
# 主题的 get-page-images 读的是 site.Params.images，写在 assets 下等于没配，
# 表现是全站 og:image / twitter:image 缺失（分享出去只有文字没有图）。
# 图片放 static/images/，1200×630；单篇想换图就在 front matter 加 images 或 cover.image。
images = ["images/og-default.png"]
# 站点主题词：主题的 head.html 会读 site.Params.keywords 输出 <meta name="keywords">，
# 同时进 JSON-LD 的 keywords。同样必须在 [params] 直接层，写进 assets 就取不到。
# 说明白：Google 明确不用它做排序，留着是给其他收录源和一个可读的主题声明。
keywords = ["技术笔记", "kotlin", "kmp", "跨平台", "思考", "折腾", "独立开发"]

# ---------- 搜索引擎站点验证（不是访问统计，别搞混） ----------
# 注意：PaperMod 的 [params.analytics.*] 只输出「验证 meta 标签」，与流量统计无关。
# 之前这里写成"填测量 ID 即可接入 Google Analytics"是错的 —— 填 G-XXXXXXX 进去
# 只会生成一段没人读的 <meta name="google-site-verification">，一条数据都不会有。
# 主题对统计零支持，真接统计要写在 layouts/partials/extend_head.html（已建好接入点，
# 内含各方案的脚本示例与"SPA 切换需手动上报"的提醒）。
# 下面这段仅在你想用 Search Console 的 HTML 标记验证时打开，填它的验证串：
# [params.analytics.google]
# SiteVerificationTag = "验证串（不是 G-XXXXXXXXXX）"

# ---------- 站点图标 ----------
# favicon 用 SVG；PaperMod 的 <link> 硬编码 type="image/png"，因此另备
# 两张 PNG（favicon-16x16.png / favicon-32x32.png，与 SVG 同图形），
# 避免「声明 png 实际返回 svg」的 MIME 错配。
[params.assets]
favicon = "favicon.svg"
favicon16x16 = "favicon-16x16.png"
favicon32x32 = "favicon-32x32.png"
# 注意：images / keywords 不在这里，它们在上面的 [params] 直接层
# （主题只读 site.Params.images）。

# ---------- 首页（由 layouts/index.html 自建模板读取，主题不感知这些键） ----------
[params.home]
postsHeading = "最新文章"
# 首页展示几篇：第一篇固定取最新，其余从剩余文章里随机抽（0 = 全部，不抽）。
# 首页因此是并排卡片（宽屏两列），见 layouts/index.html 与 custom.css 的 .ed-cards--pair。
postsLimit = 2
# 除最新一篇之外是否随机：
#   true  → 构建时用 shuffle 抽（页面仍是静态 HTML，可被收录、无闪烁；
#           每次部署会重新抽一遍，所以你发新文章时首页的"随机位"会换）
#   false → 按时间顺序取最新的前 N 篇
randomRest = true
# 卡片是否显示日期 / 阅读时长（post_meta partial）
showMeta = true

# ---------- 左列刊头（宽屏左栏 / 窄屏顶部报头共用） ----------
[params.profile]
title = "Xi"
subtitle = "Writing what's worth keeping."
# 刊名下原本还有第二段自我介绍（params.profile.desc），已按要求去掉；
# 模板用 {{ with $profile.desc }} 包裹，键不存在就不渲染，custom.css 里
# .ed-masthead-desc 那两条规则暂时闲置，将来想加回一段话直接写这个键即可。
# 头像键（imageUrl / imageTitle / imageWidth / imageHeight）已删：那四个键
# 面向的是主题自带的 home_info.html，而本站首页模板早就覆盖了它，全站没有任何
# 模板读它们 —— 属于填了也不生效的死配置。要做头像得先在 partials/ed_masthead.html
# 里加 <img> 与样式，再把键加回来（外壳统一后，改这一处 6 个外壳页同时生效）。

# ---------- 社交图标（报头） ----------
# 不需要的条目整段删除即可；index.html 按 icon 名从主题 svg.html 取图标，
# 邮箱统一读上面的 params.email（改地址不用改两遍）。
[[params.social]]
name = "GitHub"
url = "https://github.com/WLYB2021"
icon = "github"
weight = 1

[[params.social]]
name = "Email"
url = "mailto:yuxi279239@163.com"
icon = "email"
weight = 2

# 站点 RSS；svg.html 内置 rss 图标
[[params.social]]
name = "RSS"
url = "/index.xml"
icon = "rss"
weight = 3

# ---------- 结构化数据（JSON-LD） ----------
# 主题的 schema_json.html 只认 params.schema.sameAs，回退才读 params.SocialIcons；
# 本站社交图标写在 [[params.social]] 下（由自建首页消费），所以这里要再声明一遍，
# 否则线上 JSON-LD 的 sameAs 是空数组，搜索引擎拿不到你的站外身份。
[params.schema]
sameAs = ["https://github.com/WLYB2021"]

# ---------- 底部版权 ----------
# 主题 footer.html 只认三个键：footer.hideCopyright（隐藏 © 行）、
# footer.text（自定义文本）、顶层 copyright（整体替换默认 © 行）。
# 此前的 showCopyright / showPoweredBy / copyright 均为主题不读的死配置，已删。
# 年份由主题自动取构建年（now.Year），不会过期。
[params.footer]
text = "Writing what's worth keeping."

# ---------- Giscus 评论 ----------
# 已配置完成（https://giscus.app 生成）
# 前置条件：仓库 Settings → General → Features → 勾选 Discussions
# 隐藏单篇评论：在该页 front matter 加 disable_comments: true
[params.giscus]
repo = "WLYB2021/WLYB2021.github.io"
repoID = "R_kgDOVAsNXg"
category = "Announcements"
categoryID = "DIC_kwDOVAsNXs4DHUsi"
mapping = "pathname"
strict = "0"
reactionsEnabled = "1"
emitMetadata = "0"
inputPosition = "top"
theme = "preferred_color_scheme"
lang = "zh-CN"
loading = "lazy"

# ---------- 搜索 ----------
[params.search]
enable = true
fuzzy = true
heading = true
regex = false
tagnames = ["tag"]

# ---------- 相关文章 ----------
[params.related]
threshold = 80
toLower = false
includeNewer = true
count = 8