# 用户站点仓库：WLYB2021.github.io → https://wlyb2021.github.io
baseURL = "https://wlyb2021.github.io/"
defaultContentLanguage = "zh"
title = "Xi 的博客"
theme = "PaperMod"
enableRobotsTXT = true
# GitInfo：让每篇文章拿到真实的 lastmod（最后提交时间），meta 里可显示
# 「更新于」。CI 里 checkout 已带 fetch-depth: 0，本地预览也生效。
enableGitInfo = true
summaryLength = 30
hasCJKLanguage = true
# 忽略主题在更高版本 Hugo 下的历史告警
ignoreLogs = ["warning-partial-superfluous-prefix"]

# lastmod 取值顺序：显式 front matter > git 提交时间 > date
[frontmatter]
lastmod = [":git", "lastmod", "date"]

# ---------- 顶层导航 ----------
# 改 url 即可增删菜单项；weight 控制顺序（小的靠左）
[[menu.main]]
name = "主页"
url = "/"
weight = 5

[[menu.main]]
name = "文章"
url = "/posts/"
weight = 10

[[menu.main]]
name = "标签"
url = "/tags/"
weight = 15

[[menu.main]]
name = "归档"
url = "/archives/"
weight = 20

[[menu.main]]
name = "关于"
url = "/about/"
weight = 30

[[menu.main]]
name = "搜索"
url = "/search/"
weight = 40

[pagination]
pagerSize = 10

[taxonomies]
tag = "tags"

[markup]
[markup.highlight]
style = "github"
noClasses = false
lineNos = false
[markup.goldmark.renderer]
unsafe = true
[markup.goldmark.parser]
autoHeadingID = true
autoHeadingIDType = "github"

[outputs]
home = ["HTML", "RSS", "JSON"]
section = ["HTML", "RSS"]
taxonomy = ["HTML", "RSS"]
term = ["HTML", "RSS"]

[sitemap]
changefreq = "weekly"
filename = "sitemap.xml"
priority = 0.5

# 主题放在 themes/PaperMod（由 GitHub Actions 克隆，无需 Go 环境）
# ---------- 站点参数 ----------
[params]
author = "Xi"
description = "Writing what's worth keeping."
defaultTheme = "auto"
ShowReadingTime = true
ShowWordCount = true
ShowToc = true
TocOpen = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowShareButtons = true
ShowRssButton = true
DisplayFullLangName = false
comments = true
mainSections = ["posts"]
# 文章页 meta 显示「更新于 X」（lastmod 与 date 不同天时才出现）
showLastMod = true

# ---------- 访问统计（可选） ----------
# 接入后在站点层面即可生效；不接入时下面整段留空无副作用。
# PaperMod 原生支持 Google Analytics：填测量 ID 并取消注释。
# [params.analytics.google]
# SiteVerificationTag = "G-XXXXXXX"
# 另可选自托管 Umami/Plausible：本主题未内置，需在 extend_head.html 自行加 <script>。

# ---------- 站点图标 ----------
# favicon 用 SVG；PaperMod 的 <link> 硬编码 type="image/png"，因此另备
# 两张 PNG（favicon-16x16.png / favicon-32x32.png，与 SVG 同图形），
# 避免「声明 png 实际返回 svg」的 MIME 错配。
[params.assets]
favicon = "favicon.svg"
favicon16x16 = "favicon-16x16.png"
favicon32x32 = "favicon-32x32.png"

# ---------- SEO / 分享卡片 ----------
# keywords 用英文逗号分隔；填 5~10 个你真正在写的主题词
keywords = ["技术笔记", "kotlin", "kmp", "跨平台", "思考", "折腾", "独立开发"]
# 站点默认分享图（放static/images/og-default.png，建议 1200×630）
images = ["images/og-default.png"]
# 主页与各页面是否输出 canonical / OG 元信息（PaperMod 默认开启）

# ---------- 首页（由 layouts/index.html 自建模板读取，主题不感知这些键） ----------
[params.home]
postsHeading = "最新文章"
# 首页最多展示几篇文章；0 = 全部
postsLimit = 5
# 卡片是否显示日期 / 阅读时长（post_meta partial）
showMeta = true

# ---------- 左列刊头（宽屏左栏 / 窄屏顶部报头共用） ----------
[params.profile]
title = "Xi"
subtitle = "Writing what's worth keeping."
# 刊名下的第二段自我介绍
desc = "No fixed theme, no persona. Just notes worth keeping — a detour, an idea, or the clarity that comes after a mistake."
# 头像：把图片放到 static/images/ 后填路径，如 "images/avatar.jpg"；留空不显示
imageUrl = ""
imageTitle = "Xi"
imageWidth = 150
imageHeight = 150

# ---------- 联系方式 ----------
# 邮箱只填这一处，社交图标会自动引用，改地址不用改两遍
email = "yuxi279239@163.com"

# ---------- 社交图标（报头） ----------
# 不需要的条目整段删除即可；index.html 按 icon 名从主题 svg.html 取图标，
# 邮箱统一读上面的 params.email（改地址不用改两遍）。
[[params.social]]
name = "GitHub"
url = "https://github.com/WLYB2021"
icon = "github"
weight = 1

[[params.social]]
name = "Email"
url = "mailto:yuxi279239@163.com"
icon = "email"
weight = 2

# 站点 RSS；svg.html 内置 rss 图标
[[params.social]]
name = "RSS"
url = "/index.xml"
icon = "rss"
weight = 3

# ---------- 底部版权 ----------
# 主题 footer.html 只认三个键：footer.hideCopyright（隐藏 © 行）、
# footer.text（自定义文本）、顶层 copyright（整体替换默认 © 行）。
# 此前的 showCopyright / showPoweredBy / copyright 均为主题不读的死配置，已删。
# 年份由主题自动取构建年（now.Year），不会过期。
[params.footer]
text = "Writing what's worth keeping."

# ---------- Giscus 评论 ----------
# 已配置完成（https://giscus.app 生成）
# 前置条件：仓库 Settings → General → Features → 勾选 Discussions
# 隐藏单篇评论：在该页 front matter 加 disable_comments: true
[params.giscus]
repo = "WLYB2021/WLYB2021.github.io"
repoID = "R_kgDOVAsNXg"
category = "Announcements"
categoryID = "DIC_kwDOVAsNXs4DHUsi"
mapping = "pathname"
strict = "0"
reactionsEnabled = "1"
emitMetadata = "0"
inputPosition = "top"
theme = "preferred_color_scheme"
lang = "zh-CN"
loading = "lazy"

# ---------- 搜索 ----------
[params.search]
enable = true
fuzzy = true
heading = true
regex = false
tagnames = ["tag"]

# ---------- 相关文章 ----------
[params.related]
threshold = 80
toLower = false
includeNewer = true
count = 8