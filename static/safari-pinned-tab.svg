       几何与 static/favicon.svg 完全一致：圆角矩形 rx14 +
       path "M18 16h28v5.5H35.5V32H44v5.5H35.5V48H18z"。 -->
  <path fill="#000" fill-rule="evenodd" d="M14 0H50A14 14 0 0 1 64 14V50A14 14 0 0 1 50 64H14A14 14 0 0 1 0 50V14A14 14 0 0 1 14 0ZM18 16h28v5.5H35.5V32H44v5.5H35.5V48H18Z"/>
