<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="共享 UI 的分层：界面与 ViewModel 进入 commonMain，平台差异收口成接口">
  <rect x="0.5" y="0.5" width="759" height="359" rx="10" fill="#fbfaf8" stroke="#e8e4de"/>
  <defs>
    <marker id="arw4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#b03a2e"/>
    </marker>
    <marker id="arw4g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#a9a29a"/>
    </marker>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <text x="24" y="34" font-size="13" font-weight="600" fill="#8a857e" letter-spacing=".06em">图 4</text>
    <text x="64" y="34" font-size="13" fill="#8a857e" letter-spacing=".02em">界面进 commonMain；平台差异收口成接口</text>

    <!-- 共享面板 -->
    <rect x="88" y="58" width="324" height="248" rx="10" fill="#fdf4f2" stroke="#f0deda"/>
    <text x="104" y="80" font-size="12" font-weight="600" fill="#b03a2e" letter-spacing=".04em">共享 · commonMain</text>
    <g fill="#ffffff" stroke="#ddd7cf">
      <rect x="110" y="92"  width="280" height="52" rx="8"/>
      <rect x="110" y="166" width="280" height="52" rx="8"/>
      <rect x="110" y="240" width="280" height="52" rx="8"/>
    </g>
    <g font-size="13.5" fill="#2b2b2b" text-anchor="middle">
      <text x="250" y="124">UI</text>
      <text x="250" y="198">ViewModel</text>
      <text x="250" y="272">Domain</text>
    </g>
    <g stroke="#b03a2e" stroke-width="1.6" fill="none">
      <path d="M250 144 V162" marker-end="url(#arw4)"/>
      <path d="M250 218 V236" marker-end="url(#arw4)"/>
    </g>

    <!-- 平台接口 -->
    <rect x="470" y="110" width="266" height="60" rx="8" fill="#ffffff" stroke="#b03a2e" stroke-width="1.3"/>
    <text x="603" y="136" font-size="14" font-weight="700" fill="#8c2f25" text-anchor="middle">平台接口</text>
    <text x="603" y="156" font-size="12" fill="#8a857e" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">注入 / expect · actual</text>
    <path d="M412 200 L441 200 L441 140 L466 140" fill="none" stroke="#a9a29a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arw4g)"/>
    <text x="452" y="228" font-size="11.5" fill="#a09a92">调用</text>

    <!-- 各端实现 -->
    <path d="M603 170 V190 M511 190 H695" fill="none" stroke="#c9c3ba" stroke-width="1.4"/>
    <g stroke="#c9c3ba" stroke-width="1.4" fill="none">
      <path d="M511 190 V208" marker-end="url(#arw4g)"/>
      <path d="M603 190 V208" marker-end="url(#arw4g)"/>
      <path d="M695 190 V208" marker-end="url(#arw4g)"/>
    </g>
    <g fill="#ffffff" stroke="#ddd7cf">
      <rect x="470" y="210" width="82" height="54" rx="8"/>
      <rect x="562" y="210" width="82" height="54" rx="8"/>
      <rect x="654" y="210" width="82" height="54" rx="8"/>
    </g>
    <g font-size="12.5" fill="#4a4741" text-anchor="middle">
      <text x="511" y="242">Android</text>
      <text x="603" y="242">iOS</text>
      <text x="695" y="242">Desktop</text>
    </g>

    <line x1="24" y1="322" x2="736" y2="322" stroke="#e8e4de"/>
    <text x="24" y="344" font-size="13" fill="#2b2b2b">结构前提：</text>
    <text x="106" y="344" font-size="13" font-weight="700" fill="#b03a2e">UI 层不再有任何直接触达平台的路径</text>
  </g>
</svg>
