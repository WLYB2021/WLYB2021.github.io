<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="三个阶段与共享边界的移动">
  <rect x="0.5" y="0.5" width="759" height="299" rx="10" fill="#fbfaf8" stroke="#e8e4de"/>
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <text x="24" y="34" font-size="13" font-weight="600" fill="#8a857e" letter-spacing=".06em">图 1</text>
    <text x="64" y="34" font-size="13" fill="#8a857e" letter-spacing=".02em">三个阶段，共享边界一路右移</text>

    <!-- 卡片 -->
    <g>
      <rect x="24" y="66" width="196" height="126" rx="8" fill="#ffffff" stroke="#ddd7cf"/>
      <text x="44" y="104" font-size="22" font-weight="700" fill="#2b2b2b">单体</text>
      <text x="44" y="134" font-size="13" fill="#6f6b66">单端 · 单模块</text>
      <text x="44" y="160" font-size="13" fill="#6f6b66">共享边界：无</text>
    </g>
    <g>
      <rect x="282" y="66" width="196" height="126" rx="8" fill="#ffffff" stroke="#ddd7cf"/>
      <text x="302" y="104" font-size="22" font-weight="700" fill="#2b2b2b">模块</text>
      <text x="302" y="134" font-size="13" fill="#6f6b66">单端 · 多模块</text>
      <text x="302" y="160" font-size="13" fill="#6f6b66">共享边界：模块之间</text>
    </g>
    <g>
      <rect x="540" y="66" width="196" height="126" rx="8" fill="#ffffff" stroke="#b03a2e" stroke-width="1.4"/>
      <text x="560" y="104" font-size="22" font-weight="700" fill="#b03a2e">共享</text>
      <text x="560" y="134" font-size="13" fill="#6f6b66">多端</text>
      <text x="560" y="160" font-size="13" fill="#6f6b66">逻辑层 → 逻辑 + UI</text>
    </g>

    <!-- 箭头 -->
    <g stroke="#b03a2e" stroke-width="1.6" fill="none">
      <path d="M222 129 H276" marker-end="url(#arw)"/>
      <path d="M480 129 H534" marker-end="url(#arw)"/>
    </g>
    <defs>
      <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0 0 L9 4.5 L0 9 z" fill="#b03a2e"/>
      </marker>
    </defs>
    <text x="249" y="116" font-size="12" fill="#b03a2e" text-anchor="middle">拆模块</text>
    <text x="507" y="116" font-size="12" fill="#b03a2e" text-anchor="middle">提逻辑</text>
    <text x="507" y="150" font-size="11" fill="#a09a92" text-anchor="middle">迁界面 · 删旧层</text>

    <!-- 底部说明 -->
    <line x1="24" y1="232" x2="736" y2="232" stroke="#e8e4de"/>
    <text x="24" y="262" font-size="13" fill="#2b2b2b">三个阶段做的是同一个动作：</text>
    <text x="220" y="262" font-size="13" font-weight="700" fill="#b03a2e">移动共享边界</text>
    <text x="316" y="262" font-size="13" fill="#2b2b2b">。每一步都在重新回答"什么该共享、什么该各自实现"。</text>
  </g>
</svg>
