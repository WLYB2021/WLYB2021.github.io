<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-label="单体的软边界与模块的硬边界对比">
  <rect x="0.5" y="0.5" width="759" height="499" rx="10" fill="#fbfaf8" stroke="#e8e4de"/>
  <defs>
    <marker id="arw2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#b03a2e"/>
    </marker>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <text x="24" y="34" font-size="13" font-weight="600" fill="#8a857e" letter-spacing=".06em">图 2</text>
    <text x="64" y="34" font-size="13" fill="#8a857e" letter-spacing=".02em">单体：藏在包结构里的边界　vs　模块：落到构建单元上的边界</text>

    <!-- 上：单体 -->
    <text x="24" y="74" font-size="15" font-weight="700" fill="#2b2b2b">单体</text>
    <rect x="24" y="86" width="712" height="120" rx="8" fill="#ffffff" stroke="#ddd7cf"/>
    <text x="40" y="108" font-size="12" fill="#8a857e" font-family="ui-monospace, Consolas, monospace">:app</text>
    <g fill="#ffffff" stroke="#c9c3ba" stroke-dasharray="4 3">
      <rect x="40"  y="120" width="128" height="70" rx="6"/>
      <rect x="182" y="120" width="128" height="70" rx="6"/>
      <rect x="324" y="120" width="128" height="70" rx="6"/>
      <rect x="466" y="120" width="128" height="70" rx="6"/>
      <rect x="608" y="120" width="128" height="70" rx="6"/>
    </g>
    <g font-size="13" fill="#4a4741" text-anchor="middle">
      <text x="104" y="160">UI</text>
      <text x="246" y="160">ViewModel</text>
      <text x="388" y="160">Repository</text>
      <text x="530" y="160">Database</text>
      <text x="672" y="160">Network</text>
    </g>
    <text x="24" y="234" font-size="13" fill="#6f6b66">五层都在同一个构建单元里；边界只存在于包结构，是软的（虚线）</text>

    <!-- 下：模块 -->
    <text x="24" y="292" font-size="15" font-weight="700" fill="#2b2b2b">模块</text>
    <g fill="#ffffff" stroke="#ddd7cf">
      <rect x="24"  y="308" width="160" height="64" rx="8"/>
      <rect x="216" y="308" width="160" height="64" rx="8"/>
      <rect x="408" y="308" width="160" height="64" rx="8"/>
      <rect x="600" y="308" width="136" height="64" rx="8"/>
    </g>
    <g font-size="13" fill="#2b2b2b" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">
      <text x="104" y="346">:app</text>
      <text x="296" y="346">:feature-ui</text>
      <text x="488" y="346">:core-domain</text>
      <text x="668" y="346">:core-data</text>
    </g>
    <g stroke="#b03a2e" stroke-width="1.6" fill="none">
      <path d="M186 340 H212" marker-end="url(#arw2)"/>
      <path d="M378 340 H404" marker-end="url(#arw2)"/>
      <path d="M570 340 H596" marker-end="url(#arw2)"/>
      <path d="M488 416 V376" marker-end="url(#arw2)" stroke-dasharray="4 3"/>
    </g>
    <rect x="408" y="416" width="160" height="46" rx="8" fill="#ffffff" stroke="#ddd7cf"/>
    <text x="488" y="444" font-size="13" fill="#2b2b2b" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">:core-player</text>
    <text x="24" y="486" font-size="13" fill="#6f6b66">依赖单向：:app → :feature-ui → :core-domain → :core-data；反向依赖在拆开后编译即失败</text>
  </g>
</svg>
