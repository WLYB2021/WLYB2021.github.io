<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Agent 层插在应用框架层内，与 ActivityManager、PackageManager 同级">
  <rect x="0.5" y="0.5" width="759" height="439" rx="10" fill="#fbfaf8" stroke="#e8e4de"/>
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <text x="24" y="34" font-size="13" font-weight="600" fill="#8a857e" letter-spacing=".06em">图 3</text>
    <text x="64" y="34" font-size="13" fill="#8a857e" letter-spacing=".02em">Agent 层在 Android 体系中的位置</text>

    <!-- 应用层 -->
    <rect x="110" y="56" width="490" height="44" rx="8" fill="#ffffff" stroke="#ddd7cf"/>
    <text x="126" y="83" font-size="12.5" fill="#2b2b2b">应用层（音乐播放器等）</text>

    <!-- 应用框架层 -->
    <rect x="110" y="112" width="490" height="180" rx="8" fill="#ffffff" stroke="#ddd7cf"/>
    <text x="126" y="132" font-size="12" font-weight="700" fill="#6f6b66" letter-spacing=".04em">应用框架层</text>

    <!-- Agent 层 -->
    <rect x="130" y="144" width="450" height="124" rx="8" fill="#fdf4f2" stroke="#b03a2e" stroke-width="1.4"/>
    <text x="146" y="168" font-size="13" font-weight="700" fill="#8c2f25">Agent 层（新增）</text>
    <text x="146" y="188" font-size="10.5" fill="#a09a92" letter-spacing=".04em">对外四类接口</text>
    <g fill="#ffffff" stroke="#e3c4bd">
      <rect x="146" y="194" width="96" height="22" rx="4"/>
      <rect x="254" y="194" width="96" height="22" rx="4"/>
      <rect x="362" y="194" width="96" height="22" rx="4"/>
      <rect x="470" y="194" width="96" height="22" rx="4"/>
    </g>
    <g font-size="10.5" fill="#8c2f25" text-anchor="middle">
      <text x="194" y="209">能力注册</text>
      <text x="302" y="209">上下文注入</text>
      <text x="410" y="209">任务委派</text>
      <text x="518" y="209">治理接口</text>
    </g>
    <text x="146" y="232" font-size="10.5" fill="#a09a92" letter-spacing=".04em">内部四层</text>
    <g fill="#ffffff" stroke="#e3c4bd">
      <rect x="146" y="238" width="96" height="22" rx="4"/>
      <rect x="254" y="238" width="96" height="22" rx="4"/>
      <rect x="362" y="238" width="96" height="22" rx="4"/>
      <rect x="470" y="238" width="96" height="22" rx="4"/>
    </g>
    <g font-size="10.5" fill="#8c2f25" text-anchor="middle">
      <text x="194" y="253">专用 Agent</text>
      <text x="302" y="253">通用 Agent 池</text>
      <text x="410" y="253">Runtime 层</text>
      <text x="518" y="253">治理层</text>
    </g>
    <text x="126" y="284" font-size="11" fill="#8a857e">ActivityManager · PackageManager · WindowManager ……（同级）</text>

    <!-- 系统服务层 -->
    <rect x="110" y="306" width="490" height="52" rx="8" fill="#ffffff" stroke="#ddd7cf"/>
    <text x="126" y="326" font-size="12" font-weight="700" fill="#6f6b66" letter-spacing=".04em">系统服务层</text>
    <text x="126" y="346" font-size="11.5" fill="#8a857e">Binder · JobScheduler · SELinux · SQLite · ContentProvider</text>

    <!-- 内核 -->
    <rect x="110" y="372" width="490" height="40" rx="8" fill="#f4f2ee" stroke="#ddd7cf"/>
    <text x="355" y="397" font-size="12" fill="#6f6b66" text-anchor="middle">Linux 内核 / HAL</text>

    <!-- 右侧注解 -->
    <rect x="620" y="140" width="118" height="86" rx="8" fill="#ffffff" stroke="#ddd7cf"/>
    <text x="632" y="162" font-size="11" fill="#2b2b2b">不改内核</text>
    <text x="632" y="182" font-size="11" fill="#2b2b2b">不改 HAL</text>
    <text x="632" y="202" font-size="11" fill="#2b2b2b">不改系统库</text>
    <rect x="620" y="244" width="118" height="118" rx="8" fill="#ffffff" stroke="#ddd7cf"/>
    <text x="632" y="266" font-size="11" fill="#2b2b2b">复用底层机制</text>
    <text x="632" y="286" font-size="11" fill="#2b2b2b">新增的是</text>
    <text x="632" y="302" font-size="11" font-weight="700" fill="#b03a2e">管理层</text>
    <text x="632" y="326" font-size="11" fill="#2b2b2b">从零新增只有</text>
    <text x="632" y="344" font-size="11" fill="#2b2b2b">撤销原语与预算</text>
  </g>
</svg>
