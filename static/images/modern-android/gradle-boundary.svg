<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" role="img" aria-label="feature 依赖 data、data 依赖 model 的声明可以编译；data 反向依赖 feature 也仍然可以编译，Gradle 不会判断架构方向">
  <rect x="0.5" y="0.5" width="599" height="249" rx="10" fill="var(--fig-bg, #fbfaf8)" stroke="var(--fig-border, #e8e4de)"/>
  <defs>
    <marker id="gbMuted" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="var(--fig-muted, #6f6b66)"/>
    </marker>
    <marker id="gbDash" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="var(--fig-accent, #b03a2e)"/>
    </marker>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <text x="24" y="34" font-size="13" font-weight="600" fill="var(--fig-faint, #8a857e)" letter-spacing=".06em">图 4</text>
    <text x="64" y="34" font-size="13" fill="var(--fig-faint, #8a857e)">依赖声明不判断方向</text>

    <rect x="20" y="92" width="160" height="52" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <text x="100" y="118" font-size="13" font-weight="700" fill="var(--fig-text, #2b2b2b)" text-anchor="middle" dominant-baseline="central">:feature:player</text>
    <rect x="220" y="92" width="160" height="52" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <text x="300" y="118" font-size="13" font-weight="700" fill="var(--fig-text, #2b2b2b)" text-anchor="middle" dominant-baseline="central">:core:data</text>
    <rect x="420" y="92" width="160" height="52" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <text x="500" y="118" font-size="13" font-weight="700" fill="var(--fig-text, #2b2b2b)" text-anchor="middle" dominant-baseline="central">:core:model</text>

    <g stroke="var(--fig-muted, #6f6b66)" stroke-width="1.5" fill="none">
      <path d="M180 118 H216" marker-end="url(#gbMuted)"/>
      <path d="M380 118 H416" marker-end="url(#gbMuted)"/>
    </g>

    <path d="M300 144 V184 H100 V148" fill="none" stroke="var(--fig-accent, #b03a2e)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#gbDash)"/>
    <text x="200" y="176" font-size="11.5" fill="var(--fig-accent-strong, #8c2f25)" text-anchor="middle">反向依赖仍可编译</text>

    <text x="300" y="230" font-size="11.5" fill="var(--fig-muted, #6f6b66)" text-anchor="middle">Gradle 只看依赖有没有声明</text>
  </g>
</svg>
