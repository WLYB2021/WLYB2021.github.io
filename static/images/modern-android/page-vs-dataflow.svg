<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="页面中心由页面协调数据、视图和其他页面，数据流中心让数据沿固定链路到达界面，事件再返回">
  <rect x="0.5" y="0.5" width="759" height="329" rx="10" fill="var(--fig-bg, #fbfaf8)" stroke="var(--fig-border, #e8e4de)"/>
  <defs>
    <marker id="pvdArw" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="var(--fig-muted, #6f6b66)"/>
    </marker>
    <marker id="pvdAccent" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="var(--fig-accent, #b03a2e)"/>
    </marker>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <text x="24" y="34" font-size="13" font-weight="600" fill="var(--fig-faint, #8a857e)" letter-spacing=".06em">图 1</text>
    <text x="64" y="34" font-size="13" fill="var(--fig-faint, #8a857e)">页面中心与数据流中心</text>

    <line x1="380" y1="58" x2="380" y2="300" stroke="var(--fig-border, #e8e4de)"/>

    <text x="44" y="84" font-size="14" font-weight="700" fill="var(--fig-muted, #6f6b66)">页面中心</text>
    <rect x="116" y="102" width="152" height="48" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <text x="192" y="126" font-size="14" font-weight="700" fill="var(--fig-text, #2b2b2b)" text-anchor="middle" dominant-baseline="central">页面</text>

    <rect x="42" y="236" width="90" height="42" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <text x="87" y="257" font-size="13" fill="var(--fig-text, #2b2b2b)" text-anchor="middle" dominant-baseline="central">数据</text>
    <rect x="159" y="236" width="84" height="42" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <text x="201" y="257" font-size="13" fill="var(--fig-text, #2b2b2b)" text-anchor="middle" dominant-baseline="central">View</text>
    <rect x="271" y="236" width="82" height="42" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <text x="312" y="257" font-size="13" fill="var(--fig-text, #2b2b2b)" text-anchor="middle" dominant-baseline="central">其他页面</text>

    <g stroke="var(--fig-muted, #6f6b66)" stroke-width="1.4" fill="none">
      <path d="M164 150 L87 232" marker-end="url(#pvdArw)"/>
      <path d="M192 150 L201 232" marker-end="url(#pvdArw)"/>
      <path d="M220 150 L312 232" marker-end="url(#pvdArw)"/>
    </g>

    <text x="400" y="84" font-size="14" font-weight="700" fill="var(--fig-accent, #b03a2e)">数据流中心</text>
    <rect x="448" y="96" width="240" height="38" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <text x="568" y="115" font-size="13" font-weight="700" fill="var(--fig-text, #2b2b2b)" text-anchor="middle" dominant-baseline="central">数据源</text>
    <rect x="448" y="154" width="240" height="38" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <text x="568" y="173" font-size="13" font-weight="700" fill="var(--fig-text, #2b2b2b)" text-anchor="middle" dominant-baseline="central">Repository</text>
    <rect x="448" y="212" width="240" height="38" rx="8" fill="var(--fig-accent-bg, #fdf4f2)" stroke="var(--fig-accent, #b03a2e)" stroke-width="1.2"/>
    <text x="568" y="231" font-size="13" font-weight="700" fill="var(--fig-accent-strong, #8c2f25)" text-anchor="middle" dominant-baseline="central">ViewModel</text>
    <rect x="448" y="270" width="240" height="38" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <text x="568" y="289" font-size="13" font-weight="700" fill="var(--fig-text, #2b2b2b)" text-anchor="middle" dominant-baseline="central">UI</text>

    <g stroke="var(--fig-accent, #b03a2e)" stroke-width="1.4" fill="none">
      <path d="M568 134 V150" marker-end="url(#pvdAccent)"/>
      <path d="M568 192 V208" marker-end="url(#pvdAccent)"/>
      <path d="M568 250 V266" marker-end="url(#pvdAccent)"/>
      <path d="M448 289 H424 V231 H444" marker-end="url(#pvdAccent)"/>
    </g>
    <text x="400" y="224" font-size="11.5" fill="var(--fig-accent-strong, #8c2f25)">事件</text>
  </g>
</svg>
