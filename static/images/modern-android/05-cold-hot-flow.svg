<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-label="冷流每个订阅者各跑一遍上游，热流只跑一份并共享当前值">
  <rect x="0.5" y="0.5" width="759" height="349" rx="10" fill="#fbfaf8" stroke="#e8e4de"/>
  <defs>
    <marker id="flowArw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#b03a2e"/>
    </marker>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <text x="24" y="34" font-size="13" font-weight="600" fill="#8a857e" letter-spacing=".06em">图 2</text>
    <text x="64" y="34" font-size="13" fill="#8a857e" letter-spacing=".02em">冷流与热流：谁负责共享上游</text>

    <text x="24" y="86" font-size="13" font-weight="700" fill="#6f6b66">冷流 Flow</text>
    <rect x="170" y="62" width="150" height="42" rx="6" fill="#ffffff" stroke="#ddd7cf"/>
    <text x="245" y="88" font-size="12.5" fill="#2b2b2b" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">flow { }</text>
    <rect x="390" y="50" width="150" height="34" rx="6" fill="#ffffff" stroke="#ddd7cf"/>
    <text x="465" y="72" font-size="12" fill="#2b2b2b" text-anchor="middle">订阅者 A</text>
    <rect x="390" y="98" width="150" height="34" rx="6" fill="#ffffff" stroke="#ddd7cf"/>
    <text x="465" y="120" font-size="12" fill="#2b2b2b" text-anchor="middle">订阅者 B</text>
    <g stroke="#b03a2e" stroke-width="1.4" fill="none">
      <path d="M322 79 L386 68" marker-end="url(#flowArw)"/>
      <path d="M322 88 L386 114" marker-end="url(#flowArw)"/>
    </g>
    <text x="560" y="66" font-size="12" fill="#8c2f25">各跑一遍上游</text>
    <text x="560" y="86" font-size="12" fill="#6f6b66">两次订阅 = 两次查询</text>

    <text x="24" y="196" font-size="13" font-weight="700" fill="#b03a2e">热流 StateFlow</text>
    <rect x="170" y="172" width="110" height="42" rx="6" fill="#ffffff" stroke="#ddd7cf"/>
    <text x="225" y="198" font-size="12.5" fill="#2b2b2b" text-anchor="middle">上游</text>
    <rect x="312" y="172" width="130" height="42" rx="6" fill="#fdf4f2" stroke="#b03a2e"/>
    <text x="377" y="198" font-size="12.5" fill="#8c2f25" text-anchor="middle">当前值 .value</text>
    <rect x="500" y="160" width="150" height="34" rx="6" fill="#ffffff" stroke="#ddd7cf"/>
    <text x="575" y="182" font-size="12" fill="#2b2b2b" text-anchor="middle">订阅者 A</text>
    <rect x="500" y="208" width="150" height="34" rx="6" fill="#ffffff" stroke="#ddd7cf"/>
    <text x="575" y="230" font-size="12" fill="#2b2b2b" text-anchor="middle">订阅者 B</text>
    <g stroke="#b03a2e" stroke-width="1.4" fill="none">
      <path d="M282 193 H308" marker-end="url(#flowArw)"/>
      <path d="M444 187 L496 178" marker-end="url(#flowArw)"/>
      <path d="M444 200 L496 222" marker-end="url(#flowArw)"/>
    </g>

    <line x1="24" y1="266" x2="736" y2="266" stroke="#e8e4de"/>
    <text x="24" y="296" font-size="13" fill="#2b2b2b">冷流每次订阅都重跑上游；热流的上游只有一份，订阅者共享当前值。</text>
    <text x="24" y="322" font-size="13" fill="#6f6b66">冷热不是性能选项，是谁负责共享的选择。</text>
  </g>
</svg>
