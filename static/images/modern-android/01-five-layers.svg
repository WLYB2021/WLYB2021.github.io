<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" width="760" height="286" role="img" aria-label="五个层面的依赖顺序：语言、数据、UI、架构、工程">
  <rect x="0.5" y="0.5" width="759" height="285" rx="10" fill="var(--fig-bg, #fbfaf8)" stroke="var(--fig-border, #e8e4de)"/>
  <defs>
    <marker id="ftArw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="var(--fig-accent, #b03a2e)"/>
    </marker>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <text x="24" y="34" font-size="13" font-weight="600" fill="var(--fig-faint, #8a857e)" letter-spacing=".06em">图 1</text>
    <text x="64" y="34" font-size="13" fill="var(--fig-faint, #8a857e)" letter-spacing=".02em">五个层面的依赖顺序：上一层是下一层的前提</text>

    <g>
      <rect x="24"  y="62" width="128" height="106" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
      <text x="88"  y="92"  font-size="13.5" font-weight="700" fill="var(--fig-text, #2b2b2b)" text-anchor="middle">语言</text>
      <text x="88"  y="118" font-size="11.5" fill="#4a4741" text-anchor="middle">Kotlin</text>
      <text x="88"  y="140" font-size="11.5" fill="var(--fig-muted, #6f6b66)" text-anchor="middle">协程 + Flow</text>
    </g>
    <g>
      <rect x="172" y="62" width="128" height="106" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
      <text x="236" y="92"  font-size="13.5" font-weight="700" fill="var(--fig-text, #2b2b2b)" text-anchor="middle">数据</text>
      <text x="236" y="118" font-size="11.5" fill="#4a4741" text-anchor="middle">流原生</text>
      <text x="236" y="140" font-size="11.5" fill="var(--fig-muted, #6f6b66)" text-anchor="middle">Room + DataStore</text>
    </g>
    <g>
      <rect x="320" y="62" width="128" height="106" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
      <text x="384" y="92"  font-size="13.5" font-weight="700" fill="var(--fig-text, #2b2b2b)" text-anchor="middle">UI</text>
      <text x="384" y="118" font-size="11.5" fill="#4a4741" text-anchor="middle">Compose</text>
      <text x="384" y="140" font-size="11.5" fill="var(--fig-muted, #6f6b66)" text-anchor="middle">自动重组</text>
    </g>
    <g>
      <rect x="468" y="62" width="128" height="106" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
      <text x="532" y="92"  font-size="13.5" font-weight="700" fill="var(--fig-text, #2b2b2b)" text-anchor="middle">架构</text>
      <text x="532" y="118" font-size="11.5" fill="#4a4741" text-anchor="middle">MVVM + UDF</text>
      <text x="532" y="140" font-size="11.5" fill="var(--fig-muted, #6f6b66)" text-anchor="middle">单一 UiState</text>
    </g>
    <g>
      <rect x="616" y="62" width="128" height="106" rx="8" fill="var(--fig-accent-bg, #fdf4f2)" stroke="var(--fig-accent, #b03a2e)" stroke-width="1.3"/>
      <text x="680" y="92"  font-size="13.5" font-weight="700" fill="var(--fig-accent, #b03a2e)" text-anchor="middle">工程</text>
      <text x="680" y="118" font-size="11.5" fill="#4a4741" text-anchor="middle">KTS + Hilt</text>
      <text x="680" y="140" font-size="11.5" fill="var(--fig-muted, #6f6b66)" text-anchor="middle">多模块</text>
    </g>

    <g stroke="var(--fig-accent, #b03a2e)" stroke-width="1.6" fill="none">
      <path d="M154 115 H168" marker-end="url(#ftArw)"/>
      <path d="M302 115 H316" marker-end="url(#ftArw)"/>
      <path d="M450 115 H464" marker-end="url(#ftArw)"/>
      <path d="M598 115 H612" marker-end="url(#ftArw)"/>
    </g>

    <line x1="24" y1="200" x2="736" y2="200" stroke="var(--fig-border, #e8e4de)"/>
    <text x="24" y="230" font-size="13" fill="var(--fig-text, #2b2b2b)">没有协程，数据层就没有流可返回；没有流原生的 API，架构层就没有单一 </text>
    <text x="24" y="252" font-size="13" fill="var(--fig-text, #2b2b2b)">状态可暴露；没有架构层确定状态的归属，Compose 的自动重组就没有触发源。</text>
    <text x="24" y="272" font-size="13" font-weight="700" fill="var(--fig-accent, #b03a2e)" dx="0">工程层最后稳定，因为它要标准化的对象是前四层的结论。</text>
  </g>
</svg>
