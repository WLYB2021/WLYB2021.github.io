<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="传统范式显式注册监听，Compose 由编译器从读取关系中推导依赖">
  <rect x="0.5" y="0.5" width="759" height="299" rx="10" fill="var(--fig-bg, #fbfaf8)" stroke="var(--fig-border, #e8e4de)"/>
  <defs>
    <marker id="ma2Arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="var(--fig-accent, #b03a2e)"/>
    </marker>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <text x="24" y="34" font-size="13" font-weight="600" fill="var(--fig-faint, #8a857e)" letter-spacing=".06em">图 3</text>
    <text x="64" y="34" font-size="13" fill="var(--fig-faint, #8a857e)" letter-spacing=".02em">自动重组的本质：连接关系由编译器推导，不由开发者注册</text>

    <!-- 传统范式 -->
    <text x="24" y="80" font-size="13" font-weight="700" fill="var(--fig-muted, #6f6b66)">传统范式</text>
    <rect x="110" y="58" width="614" height="46" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <text x="417" y="86" font-size="12.5" fill="var(--fig-text, #2b2b2b)" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">stateFlow.collect { render(it) }　—　开发者显式注册监听</text>

    <!-- Compose -->
    <text x="24" y="176" font-size="13" font-weight="700" fill="var(--fig-accent, #b03a2e)">Compose</text>
    <rect x="110" y="154" width="190" height="46" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-accent, #b03a2e)" stroke-width="1.2"/>
    <text x="205" y="182" font-size="12.5" fill="var(--fig-text, #2b2b2b)" text-anchor="middle">只写「读 state、描述界面」</text>
    <rect x="322" y="154" width="190" height="46" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-accent, #b03a2e)" stroke-width="1.2"/>
    <text x="417" y="176" font-size="12.5" fill="var(--fig-text, #2b2b2b)" text-anchor="middle">编译器在编译期发现</text>
    <text x="417" y="192" font-size="11" fill="var(--fig-muted, #6f6b66)" text-anchor="middle">「谁读取了这个状态」</text>
    <rect x="534" y="154" width="190" height="46" rx="8" fill="var(--fig-accent-bg, #fdf4f2)" stroke="var(--fig-accent, #b03a2e)" stroke-width="1.3"/>
    <text x="629" y="176" font-size="12.5" font-weight="700" fill="var(--fig-accent-strong, #8c2f25)" text-anchor="middle">运行时只重组</text>
    <text x="629" y="192" font-size="11" fill="var(--fig-accent-strong, #8c2f25)" text-anchor="middle">读取了该状态的作用域</text>
    <g stroke="var(--fig-accent, #b03a2e)" stroke-width="1.5" fill="none">
      <path d="M302 177 H318" marker-end="url(#ma2Arw)"/>
      <path d="M514 177 H530" marker-end="url(#ma2Arw)"/>
    </g>

    <line x1="24" y1="230" x2="736" y2="230" stroke="var(--fig-border, #e8e4de)"/>
    <text x="24" y="260" font-size="13" fill="var(--fig-text, #2b2b2b)">没有人写「监听 state」，但编译器生成了等价的连接。</text>
    <text x="24" y="260" font-size="13" font-weight="700" fill="var(--fig-accent, #b03a2e)" dx="344">第一个后果：不存在「忘记监听」。</text>
  </g>
</svg>
