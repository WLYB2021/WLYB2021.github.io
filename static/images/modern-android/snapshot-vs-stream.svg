<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="一次查询返回快照后关系结束；持续订阅让数据变化沿 Flow 不断到达界面">
  <rect x="0.5" y="0.5" width="759" height="319" rx="10" fill="var(--fig-bg, #fbfaf8)" stroke="var(--fig-border, #e8e4de)"/>
  <defs>
    <marker id="svsMuted" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="var(--fig-muted, #6f6b66)"/>
    </marker>
    <marker id="svsAccent" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="var(--fig-accent, #b03a2e)"/>
    </marker>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <text x="24" y="34" font-size="13" font-weight="600" fill="var(--fig-faint, #8a857e)" letter-spacing=".06em">图 2</text>
    <text x="64" y="34" font-size="13" fill="var(--fig-faint, #8a857e)">一次查询与持续订阅</text>

    <line x1="380" y1="58" x2="380" y2="298" stroke="var(--fig-border, #e8e4de)"/>

    <text x="44" y="82" font-size="14" font-weight="700" fill="var(--fig-muted, #6f6b66)">一次查询</text>
    <rect x="126" y="104" width="140" height="44" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <text x="196" y="126" font-size="13.5" font-weight="700" fill="var(--fig-text, #2b2b2b)" text-anchor="middle" dominant-baseline="central">UI</text>
    <rect x="126" y="234" width="140" height="44" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <text x="196" y="256" font-size="13.5" font-weight="700" fill="var(--fig-text, #2b2b2b)" text-anchor="middle" dominant-baseline="central">Room</text>

    <g stroke="var(--fig-muted, #6f6b66)" stroke-width="1.4" fill="none">
      <path d="M170 148 V230" marker-end="url(#svsMuted)"/>
      <path d="M232 234 V152" marker-end="url(#svsMuted)"/>
    </g>
    <text x="161" y="195" font-size="11.5" fill="var(--fig-muted, #6f6b66)" text-anchor="end">查询</text>
    <text x="241" y="195" font-size="11.5" fill="var(--fig-muted, #6f6b66)" text-anchor="start">快照</text>
    <text x="196" y="302" font-size="12" fill="var(--fig-faint, #8a857e)" text-anchor="middle">关系结束</text>

    <text x="420" y="82" font-size="14" font-weight="700" fill="var(--fig-accent, #b03a2e)">持续订阅</text>
    <rect x="486" y="96" width="140" height="40" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <text x="556" y="116" font-size="13.5" font-weight="700" fill="var(--fig-text, #2b2b2b)" text-anchor="middle" dominant-baseline="central">UI</text>
    <rect x="486" y="160" width="140" height="40" rx="8" fill="var(--fig-accent-bg, #fdf4f2)" stroke="var(--fig-accent, #b03a2e)" stroke-width="1.2"/>
    <text x="556" y="180" font-size="13.5" font-weight="700" fill="var(--fig-accent-strong, #8c2f25)" text-anchor="middle" dominant-baseline="central">Flow</text>
    <rect x="486" y="224" width="140" height="40" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <text x="556" y="244" font-size="13.5" font-weight="700" fill="var(--fig-text, #2b2b2b)" text-anchor="middle" dominant-baseline="central">Room</text>

    <g stroke="var(--fig-accent, #b03a2e)" stroke-width="1.4" fill="none">
      <path d="M556 224 V204" marker-end="url(#svsAccent)"/>
      <path d="M556 160 V140" marker-end="url(#svsAccent)"/>
      <path d="M486 116 H456 V180 H482" marker-end="url(#svsAccent)"/>
    </g>
    <text x="566" y="216" font-size="11.5" fill="var(--fig-accent-strong, #8c2f25)">变化</text>
    <text x="566" y="154" font-size="11.5" fill="var(--fig-accent-strong, #8c2f25)">新值</text>
    <text x="450" y="174" font-size="11.5" fill="var(--fig-accent-strong, #8c2f25)" text-anchor="end">订阅</text>
  </g>
</svg>
