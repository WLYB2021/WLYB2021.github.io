<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="返回栈由框架内部维护时只能发事务，Navigation 3 把栈变成调用方持有的可观察列表">
  <rect x="0.5" y="0.5" width="759" height="379" rx="10" fill="var(--fig-bg, #fbfaf8)" stroke="var(--fig-border, #e8e4de)"/>
  <defs>
    <marker id="navArw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="var(--fig-accent, #b03a2e)"/>
    </marker>
    <marker id="navArwG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="var(--fig-muted, #6f6b66)"/>
    </marker>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <text x="24" y="34" font-size="13" font-weight="600" fill="var(--fig-faint, #8a857e)" letter-spacing=".06em">图 4</text>
    <text x="64" y="34" font-size="13" fill="var(--fig-faint, #8a857e)" letter-spacing=".02em">返回栈：栈在框架里，还是在调用方手里</text>

    <text x="24" y="78" font-size="13" font-weight="700" fill="var(--fig-muted, #6f6b66)">FragmentManager：栈在框架里</text>
    <rect x="24" y="92" width="340" height="196" rx="8" fill="none" stroke="var(--fig-line, #ddd7cf)" stroke-dasharray="5 4"/>
    <text x="40" y="116" font-size="11.5" fill="var(--fig-faint, #8a857e)" font-family="ui-monospace, Consolas, monospace">FragmentManager</text>
    <rect x="60" y="132" width="270" height="32" rx="5" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <text x="195" y="153" font-size="12" fill="var(--fig-text, #2b2b2b)" text-anchor="middle">Detail（栈顶）</text>
    <rect x="60" y="172" width="270" height="32" rx="5" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <text x="195" y="193" font-size="12" fill="var(--fig-text, #2b2b2b)" text-anchor="middle">List</text>
    <rect x="60" y="212" width="270" height="32" rx="5" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <text x="195" y="233" font-size="12" fill="var(--fig-text, #2b2b2b)" text-anchor="middle">Home</text>
    <text x="24" y="312" font-size="12.5" fill="var(--fig-muted, #6f6b66)">只能发事务；读到的只是只读副本。</text>

    <text x="400" y="78" font-size="13" font-weight="700" fill="var(--fig-accent, #b03a2e)">Navigation 3：栈在调用方</text>
    <rect x="430" y="100" width="180" height="32" rx="5" fill="var(--fig-accent-bg, #fdf4f2)" stroke="var(--fig-accent, #b03a2e)"/>
    <text x="520" y="121" font-size="12" fill="var(--fig-accent-strong, #8c2f25)" text-anchor="middle">Detail（末尾）</text>
    <rect x="430" y="140" width="180" height="32" rx="5" fill="var(--fig-accent-bg, #fdf4f2)" stroke="var(--fig-accent, #b03a2e)"/>
    <text x="520" y="161" font-size="12" fill="var(--fig-accent-strong, #8c2f25)" text-anchor="middle">Home</text>
    <g stroke="var(--fig-accent, #b03a2e)" stroke-width="1.4" fill="none">
      <path d="M648 116 H616" marker-end="url(#navArw)"/>
    </g>
    <text x="654" y="112" font-size="11.5" fill="var(--fig-accent-strong, #8c2f25)" font-family="ui-monospace, Consolas, monospace">add()</text>

    <rect x="430" y="196" width="180" height="36" rx="5" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <text x="520" y="219" font-size="12" fill="var(--fig-text, #2b2b2b)" text-anchor="middle">NavDisplay</text>
    <path d="M520 178 V192" stroke="var(--fig-muted, #6f6b66)" stroke-width="1.3" fill="none" marker-end="url(#navArwG)"/>
    <text x="528" y="192" font-size="11" fill="var(--fig-muted, #6f6b66)">读</text>
    <text x="400" y="312" font-size="12.5" fill="var(--fig-muted, #6f6b66)">栈就是 SnapshotStateList。</text>

    <line x1="24" y1="330" x2="736" y2="330" stroke="var(--fig-border, #e8e4de)"/>
    <text x="24" y="358" font-size="13" fill="var(--fig-text, #2b2b2b)">同样是返回栈：一个只能发指令，一个是一个可观察、可断言的列表。</text>
  </g>
</svg>
