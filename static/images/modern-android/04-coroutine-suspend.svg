<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="阻塞的线程被整段时间占住，挂起的协程让出线程">
  <rect x="0.5" y="0.5" width="759" height="339" rx="10" fill="var(--fig-bg, #fbfaf8)" stroke="var(--fig-border, #e8e4de)"/>
  <defs>
    <marker id="susArw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="var(--fig-accent, #b03a2e)"/>
    </marker>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <text x="24" y="34" font-size="13" font-weight="600" fill="var(--fig-faint, #8a857e)" letter-spacing=".06em">图 1</text>
    <text x="64" y="34" font-size="13" fill="var(--fig-faint, #8a857e)" letter-spacing=".02em">挂起不是等待：协程让出线程，线程去干别的</text>

    <text x="24" y="89" font-size="13" font-weight="700" fill="var(--fig-muted, #6f6b66)">线程（阻塞）</text>
    <rect x="140" y="64" width="500" height="42" rx="6" fill="var(--fig-accent-bg, #fdf4f2)" stroke="var(--fig-accent, #b03a2e)"/>
    <text x="390" y="90" font-size="12.5" fill="var(--fig-accent-strong, #8c2f25)" text-anchor="middle">Thread.sleep / 阻塞 IO：整段时间里，这条线程被占住</text>

    <text x="24" y="179" font-size="13" font-weight="700" fill="var(--fig-accent, #b03a2e)">协程（挂起）</text>
    <rect x="140" y="154" width="112" height="42" rx="6" fill="var(--fig-card, #ffffff)" stroke="var(--fig-accent, #b03a2e)"/>
    <text x="196" y="180" font-size="12.5" fill="var(--fig-text, #2b2b2b)" text-anchor="middle">运行</text>
    <rect x="260" y="154" width="240" height="42" rx="6" fill="var(--fig-bg, #fbfaf8)" stroke="var(--fig-accent, #b03a2e)" stroke-dasharray="5 4"/>
    <text x="380" y="174" font-size="12.5" fill="var(--fig-accent-strong, #8c2f25)" text-anchor="middle">挂起，不占线程</text>
    <text x="380" y="190" font-size="11" fill="var(--fig-muted, #6f6b66)" text-anchor="middle">线程被释放，去跑别的协程</text>
    <rect x="508" y="154" width="132" height="42" rx="6" fill="var(--fig-card, #ffffff)" stroke="var(--fig-accent, #b03a2e)"/>
    <text x="574" y="180" font-size="12.5" fill="var(--fig-text, #2b2b2b)" text-anchor="middle">恢复，接着跑</text>

    <g stroke="var(--fig-accent, #b03a2e)" stroke-width="1.4" fill="none">
      <path d="M254 175 H258" marker-end="url(#susArw)"/>
      <path d="M502 175 H506" marker-end="url(#susArw)"/>
    </g>

    <line x1="24" y1="232" x2="736" y2="232" stroke="var(--fig-border, #e8e4de)"/>
    <text x="24" y="262" font-size="13" fill="var(--fig-text, #2b2b2b)">挂起时，协程在堆上只留几十字节的状态；被释放出来的是整条线程。</text>
    <text x="24" y="288" font-size="13" fill="var(--fig-muted, #6f6b66)">所以几千个并发可以共用几条线程，而不是几千条线程各自占着内存。</text>
  </g>
</svg>
