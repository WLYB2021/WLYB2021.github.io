<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-label="一次删除从 UI 事件进入 ViewModel 和 Repository，写入 Room 后重新生成状态并触发界面重组">
  <rect x="0.5" y="0.5" width="759" height="309" rx="10" fill="var(--fig-bg, #fbfaf8)" stroke="var(--fig-border, #e8e4de)"/>
  <defs>
    <marker id="ddMuted" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="var(--fig-muted, #6f6b66)"/>
    </marker>
    <marker id="ddAccent" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="var(--fig-accent, #b03a2e)"/>
    </marker>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <text x="24" y="34" font-size="13" font-weight="600" fill="var(--fig-faint, #8a857e)" letter-spacing=".06em">图 3</text>
    <text x="64" y="34" font-size="13" fill="var(--fig-faint, #8a857e)">一次删除</text>

    <rect x="24" y="84" width="200" height="56" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <circle cx="46" cy="112" r="10" fill="var(--fig-muted, #6f6b66)"/>
    <text x="46" y="112" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
    <text x="66" y="112" font-size="13.5" font-weight="700" fill="var(--fig-text, #2b2b2b)" dominant-baseline="central">UI</text>

    <rect x="280" y="84" width="200" height="56" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <circle cx="302" cy="112" r="10" fill="var(--fig-muted, #6f6b66)"/>
    <text x="302" y="112" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
    <text x="322" y="112" font-size="13.5" font-weight="700" fill="var(--fig-text, #2b2b2b)" dominant-baseline="central">ViewModel</text>

    <rect x="536" y="84" width="200" height="56" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <circle cx="558" cy="112" r="10" fill="var(--fig-muted, #6f6b66)"/>
    <text x="558" y="112" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
    <text x="578" y="112" font-size="13.5" font-weight="700" fill="var(--fig-text, #2b2b2b)" dominant-baseline="central">Repository</text>

    <rect x="536" y="214" width="200" height="56" rx="8" fill="var(--fig-accent-bg, #fdf4f2)" stroke="var(--fig-accent, #b03a2e)" stroke-width="1.2"/>
    <circle cx="558" cy="242" r="10" fill="var(--fig-accent, #b03a2e)"/>
    <text x="558" y="242" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
    <text x="578" y="242" font-size="13.5" font-weight="700" fill="var(--fig-accent-strong, #8c2f25)" dominant-baseline="central">Room</text>

    <rect x="280" y="214" width="200" height="56" rx="8" fill="var(--fig-accent-bg, #fdf4f2)" stroke="var(--fig-accent, #b03a2e)" stroke-width="1.2"/>
    <circle cx="302" cy="242" r="10" fill="var(--fig-accent, #b03a2e)"/>
    <text x="302" y="242" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
    <text x="322" y="242" font-size="13.5" font-weight="700" fill="var(--fig-accent-strong, #8c2f25)" dominant-baseline="central">StateFlow</text>

    <rect x="24" y="214" width="200" height="56" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <circle cx="46" cy="242" r="10" fill="var(--fig-muted, #6f6b66)"/>
    <text x="46" y="242" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">6</text>
    <text x="66" y="242" font-size="13.5" font-weight="700" fill="var(--fig-text, #2b2b2b)" dominant-baseline="central">UI</text>

    <g stroke="var(--fig-muted, #6f6b66)" stroke-width="1.4" fill="none">
      <path d="M224 112 H276" marker-end="url(#ddMuted)"/>
      <path d="M480 112 H532" marker-end="url(#ddMuted)"/>
      <path d="M636 140 V210" marker-end="url(#ddAccent)"/>
    </g>
    <g stroke="var(--fig-accent, #b03a2e)" stroke-width="1.4" fill="none">
      <path d="M532 242 H484" marker-end="url(#ddAccent)"/>
      <path d="M276 242 H228" marker-end="url(#ddAccent)"/>
    </g>
    <text x="250" y="102" font-size="11.5" fill="var(--fig-muted, #6f6b66)" text-anchor="middle">删除</text>
    <text x="506" y="102" font-size="11.5" fill="var(--fig-muted, #6f6b66)" text-anchor="middle">写入</text>
    <text x="646" y="180" font-size="11.5" fill="var(--fig-accent-strong, #8c2f25)">SQL</text>
    <text x="508" y="232" font-size="11.5" fill="var(--fig-accent-strong, #8c2f25)" text-anchor="middle">新结果</text>
    <text x="252" y="232" font-size="11.5" fill="var(--fig-accent-strong, #8c2f25)" text-anchor="middle">重组</text>
  </g>
</svg>
