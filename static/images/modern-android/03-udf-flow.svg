<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="单向数据流：事件从 UI 向上到 ViewModel，状态向下回到 UI">
  <rect x="0.5" y="0.5" width="759" height="359" rx="10" fill="var(--fig-bg, #fbfaf8)" stroke="var(--fig-border, #e8e4de)"/>
  <defs>
    <marker id="udfArw" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--fig-accent, #b03a2e)"/>
    </marker>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <text x="24" y="34" font-size="13" font-weight="600" fill="var(--fig-faint, #8a857e)" letter-spacing=".06em">图 5</text>
    <text x="64" y="34" font-size="13" fill="var(--fig-faint, #8a857e)" letter-spacing=".02em">单向数据流：事件向上，状态向下</text>

    <g transform="translate(120,-30)">
    <rect x="40" y="150" width="190" height="62" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-line, #ddd7cf)"/>
    <text x="135" y="176" font-size="12.5" font-weight="700" fill="var(--fig-text, #2b2b2b)" text-anchor="middle">数据层 · Repository</text>
    <text x="135" y="195" font-size="11" fill="var(--fig-muted, #6f6b66)" text-anchor="middle">Flow / suspend</text>

    <rect x="280" y="150" width="200" height="62" rx="8" fill="var(--fig-accent-bg, #fdf4f2)" stroke="var(--fig-accent, #b03a2e)" stroke-width="1.3"/>
    <text x="380" y="176" font-size="12.5" font-weight="700" fill="var(--fig-accent-strong, #8c2f25)" text-anchor="middle">ViewModel</text>
    <text x="380" y="195" font-size="11" fill="var(--fig-muted, #6f6b66)" text-anchor="middle">单一 StateFlow&lt;UiState&gt;</text>

    <rect x="280" y="266" width="200" height="62" rx="8" fill="var(--fig-card, #ffffff)" stroke="var(--fig-accent, #b03a2e)" stroke-width="1.2"/>
    <text x="380" y="292" font-size="12.5" font-weight="700" fill="var(--fig-accent-strong, #8c2f25)" text-anchor="middle">UI 层</text>
    <text x="380" y="311" font-size="11" fill="var(--fig-muted, #6f6b66)" text-anchor="middle">渲染状态 · 上抛事件</text>

    <path d="M234 181 H274" stroke="var(--fig-accent, #b03a2e)" stroke-width="1.5" fill="none" marker-end="url(#udfArw)"/>
    <text x="238" y="170" font-size="11.5" fill="var(--fig-accent-strong, #8c2f25)">Flow</text>

    <path d="M322 262 V216" stroke="var(--fig-accent, #b03a2e)" stroke-width="1.5" fill="none" marker-end="url(#udfArw)"/>
    <text x="330" y="242" font-size="11.5" fill="var(--fig-accent-strong, #8c2f25)">事件</text>

    <path d="M438 216 V262" stroke="var(--fig-accent, #b03a2e)" stroke-width="1.5" fill="none" marker-end="url(#udfArw)"/>
    <text x="446" y="242" font-size="11.5" fill="var(--fig-accent-strong, #8c2f25)">状态</text>

    </g>

    <line x1="24" y1="318" x2="736" y2="318" stroke="var(--fig-border, #e8e4de)"/>
    <text x="24" y="344" font-size="12.5" fill="var(--fig-text, #2b2b2b)">UI 不修改状态，ViewModel 不直接操作 UI；状态一变，读它的界面跟着重画。</text>
  </g>
</svg>
