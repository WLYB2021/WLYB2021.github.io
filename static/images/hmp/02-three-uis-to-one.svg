<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 282" width="760" height="282" role="img" aria-label="三份 UI 并行维护收成为一套共享 UI 加平台桥接层">
  <rect x="0.5" y="0.5" width="759" height="281" rx="10" fill="#fbfaf8" stroke="#e8e4de"/>
  <defs>
    <marker id="hmpArw2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#b03a2e"/>
    </marker>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <text x="24" y="34" font-size="13" font-weight="600" fill="#8a857e" letter-spacing=".06em">图 2</text>
    <text x="64" y="34" font-size="13" fill="#8a857e" letter-spacing=".02em">三份并行维护的 UI，收成一套共享 UI</text>

    <!-- 迁移前 -->
    <text x="24" y="76" font-size="13" font-weight="700" fill="#2b2b2b">迁移前</text>
    <g fill="#ffffff" stroke="#ddd7cf">
      <rect x="24" y="88"  width="180" height="44" rx="8"/>
      <rect x="24" y="142" width="180" height="44" rx="8"/>
      <rect x="24" y="196" width="180" height="44" rx="8"/>
    </g>
    <g font-size="12.5" fill="#4a4741">
      <text x="114" y="116" text-anchor="middle">Android · Compose</text>
      <text x="114" y="170" text-anchor="middle">iOS · SwiftUI</text>
      <text x="114" y="224" text-anchor="middle">Desktop · Compose</text>
    </g>

    <path d="M214 170 H282" stroke="#b03a2e" stroke-width="1.8" fill="none" marker-end="url(#hmpArw2)"/>
    <text x="248" y="158" font-size="11" fill="#a09a92" text-anchor="middle">v7.0 / v7.1</text>

    <!-- 迁移后 -->
    <text x="306" y="76" font-size="13" font-weight="700" fill="#2b2b2b">迁移后</text>
    <rect x="306" y="88" width="430" height="58" rx="8" fill="#fdf4f2" stroke="#b03a2e" stroke-width="1.3"/>
    <text x="372" y="112" font-size="13" font-weight="700" fill="#8c2f25">shared-ui · commonMain</text>
    <text x="372" y="132" font-size="12" fill="#6f6b66">UI + ViewModel，三端共用一份</text>

    <g stroke="#c9c3ba" stroke-width="1.4" fill="none">
      <path d="M372 146 V168" marker-end="url(#hmpArw2)"/>
      <path d="M521 146 V168" marker-end="url(#hmpArw2)"/>
      <path d="M670 146 V168" marker-end="url(#hmpArw2)"/>
    </g>
    <g fill="#ffffff" stroke="#ddd7cf">
      <rect x="306" y="170" width="132" height="48" rx="8"/>
      <rect x="455" y="170" width="132" height="48" rx="8"/>
      <rect x="604" y="170" width="132" height="48" rx="8"/>
    </g>
    <g font-size="12" fill="#4a4741" text-anchor="middle">
      <text x="372" y="199">androidMain 桥接</text>
      <text x="521" y="199">iosMain 桥接</text>
      <text x="670" y="199">desktopMain 桥接</text>
    </g>

    <text x="306" y="244" font-size="12.5" fill="#2b2b2b">各端只剩播放引擎与平台能力</text>
    <text x="306" y="266" font-size="12" fill="#6f6b66">APK 46.9MB → 13.2MB；iOS 侧删掉 67 个 SwiftUI 文件，壳收敛至 17 个</text>
  </g>
</svg>
