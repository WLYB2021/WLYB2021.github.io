<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 258" width="760" height="258" role="img" aria-label="HMP 从单模块到三端共享 UI 的六个落点与共享边界移动">
  <rect x="0.5" y="0.5" width="759" height="257" rx="10" fill="#fbfaf8" stroke="#e8e4de"/>
  <defs>
    <marker id="hmpArw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#b03a2e"/>
    </marker>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <text x="24" y="34" font-size="13" font-weight="600" fill="#8a857e" letter-spacing=".06em">图 1</text>
    <text x="64" y="34" font-size="13" fill="#8a857e" letter-spacing=".02em">六个落点，共享边界一路外移</text>

    <g>
      <rect x="12"  y="62" width="107" height="100" rx="8" fill="#ffffff" stroke="#ddd7cf"/>
      <text x="24" y="88"  font-size="12.5" font-weight="700" fill="#2b2b2b">v2.0 · 04-23</text>
      <text x="24" y="112" font-size="12" fill="#4a4741">单模块</text>
      <text x="24" y="142" font-size="11" fill="#b03a2e">不共享</text>
    </g>
    <g>
      <rect x="137" y="62" width="107" height="100" rx="8" fill="#ffffff" stroke="#ddd7cf"/>
      <text x="149" y="88"  font-size="12.5" font-weight="700" fill="#2b2b2b">模块化</text>
      <text x="149" y="112" font-size="12" fill="#4a4741">拆出 5 个模块</text>
      <text x="149" y="142" font-size="11" fill="#b03a2e">不共享</text>
    </g>
    <g>
      <rect x="262" y="62" width="107" height="100" rx="8" fill="#ffffff" stroke="#ddd7cf"/>
      <text x="274" y="88"  font-size="12.5" font-weight="700" fill="#2b2b2b">iOS 适配</text>
      <text x="274" y="112" font-size="12" fill="#4a4741">逻辑层下沉</text>
      <text x="274" y="142" font-size="11" fill="#b03a2e">domain + data</text>
    </g>
    <g>
      <rect x="387" y="62" width="107" height="100" rx="8" fill="#ffffff" stroke="#ddd7cf"/>
      <text x="399" y="88"  font-size="12.5" font-weight="700" fill="#2b2b2b">桌面端</text>
      <text x="399" y="112" font-size="12" fill="#4a4741">第三端跑通</text>
      <text x="399" y="142" font-size="11" fill="#b03a2e">domain + data</text>
    </g>
    <g>
      <rect x="512" y="62" width="107" height="100" rx="8" fill="#ffffff" stroke="#ddd7cf"/>
      <text x="524" y="88"  font-size="12.5" font-weight="700" fill="#2b2b2b">v7.0</text>
      <text x="524" y="112" font-size="12" fill="#4a4741">UI 收成一套</text>
      <text x="524" y="142" font-size="11" fill="#b03a2e">+ UI · 双端</text>
    </g>
    <g>
      <rect x="637" y="62" width="107" height="100" rx="8" fill="#fdf4f2" stroke="#b03a2e" stroke-width="1.3"/>
      <text x="649" y="88"  font-size="12.5" font-weight="700" fill="#b03a2e">v7.1</text>
      <text x="649" y="112" font-size="12" fill="#4a4741">iOS 全量切换</text>
      <text x="649" y="142" font-size="11" fill="#b03a2e">+ UI · 三端</text>
    </g>

    <g stroke="#b03a2e" stroke-width="1.5" fill="none">
      <path d="M121 112 H133" marker-end="url(#hmpArw)"/>
      <path d="M246 112 H258" marker-end="url(#hmpArw)"/>
      <path d="M371 112 H383" marker-end="url(#hmpArw)"/>
      <path d="M496 112 H508" marker-end="url(#hmpArw)"/>
      <path d="M621 112 H633" marker-end="url(#hmpArw)"/>
    </g>

    <line x1="12" y1="196" x2="744" y2="196" stroke="#e8e4de"/>
    <text x="12" y="228" font-size="13" fill="#2b2b2b">每次移动之间，架构都停在原处、功能继续增长——</text>
    <text x="12" y="248" font-size="13" font-weight="700" fill="#b03a2e">边界不是按规划挪的，是被当时的压力推着挪的。</text>
  </g>
</svg>
